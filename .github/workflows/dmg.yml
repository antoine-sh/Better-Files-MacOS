name: DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write # attach the .dmg to the release on tag pushes
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build FileOS.app
        run: bash scripts/bundle.sh
      - name: Sign ad hoc
        # shortcut: no Developer ID or notarization, so Gatekeeper asks on first open; add secrets to sign for real.
        run: codesign --force --deep --sign - FileOS.app
      - name: Make the .dmg
        run: |
          mkdir dmg
          cp -R FileOS.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname FileOS -srcfolder dmg -format UDZO -ov FileOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FileOS-dmg
          path: FileOS.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" FileOS.dmg --generate-notes || gh release upload "$GITHUB_REF_NAME" FileOS.dmg --clobber
