name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build (slow type-checking reported as warnings)
        timeout-minutes: 15
        run: >-
          swift build
          -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300
          -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300
      - name: Test
        timeout-minutes: 15
        run: swift test
      - name: Self-test
        timeout-minutes: 15
        run: swift run FileOSApp --self-test
